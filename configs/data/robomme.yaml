root: ${oc.env:RCE_DATA_DIR,data}  # converted files in <root>/robomme/<task>.h5 (scripts/tmp_train-gan/convert_robomme.py)
ext: h5
obs_horizon: 1
action_horizon: 4                  # Octo-native chunk (MME-VLA's 20 breaks Octo's DDPM head)
val_ratio: 0.1                     # last 10 of 100 demos per task -> test/loss
task:
  _target_: src.robomme.RoboMMETask
  _partial_: true
  obs_stride: 8                    # = MME-VLA TokenDrop temporal stride
  action_offset: 0                 # action window starts at t - action_offset
sources: {robomme: true}
