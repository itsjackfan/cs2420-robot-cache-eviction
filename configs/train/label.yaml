# Attribution labelling, no training (src/training/label.py). Use with init_from=<checkpoint> eval.tasks=[] (no rollouts).
defaults:
  - baseline
  - _self_

loop: src.training.label.label
epochs: 0
batch_size: 16
demos_per_task: 20   # first demos of each task's train split
n_mc: 4              # draws of (noise step k, noise, projection v) for grad_token / score_token
